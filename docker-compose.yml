services:
  app:
    build: .
    image: ghcr.io/its-the-vibe/vibeserver:latest
    pull_policy: always
    ports:
      - "${PORT}:8080"
    env_file:
      - .env
    volumes:
      - ./html:/app/dist:ro
    read_only: true
    # Point to your external Redis instance via config.yaml
    restart: on-failure:10
